name: Dependency Refresh

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: audit
        run: |
          npm audit --audit-level=low --json > audit-report.json 2>&1 || true
          echo "report=$(cat audit-report.json)" >> $GITHUB_ENV
      - name: Create issue if vulnerabilities found
        if: ${{ env.report != '{}' && env.report != '' }}
        run: |
          AUDIT_BODY="$(npm audit --audit-level=low 2>&1 || true)"
          gh issue create \
            --title "Weekly Dependency Audit — Vulnerabilities Found" \
            --body "$(printf '## Dependency Audit Report\n\nThe weekly dependency scan found vulnerabilities in the project.\n\n%s\n\n---\n_Generated automatically by the Dependency Refresh workflow._\n' "$AUDIT_BODY")" \
            --label "dependencies,security"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create issue if no vulnerabilities
        if: ${{ env.report == '{}' || env.report == '' }}
        run: |
          gh issue create \
            --title "Weekly Dependency Audit — All Clear" \
            --body "$(printf '## Dependency Audit Report\n\nNo vulnerabilities found in the project dependencies.\n\n---\n_Generated automatically by the Dependency Refresh workflow._\n')" \
            --label "dependencies"
        env:
          GH_TOKEN: ${{ github.token }}
